[package]
name = "ai-usage-widget"
version = "0.2.0"
description = "Windows desktop widget showing AI plan usage and quota for Codex and Claude"
authors = ["teeradetchratchapaiboon"]
edition = "2021"

[lib]
name = "ai_usage_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
# In-app updater (signed latest.json from GitHub releases). Pinned: 2.13.x
# requires tauri ^2.12 and this crate stays on the locked tauri 2.11.x.
tauri-plugin-updater = "=2.12.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing (fingerprints, privacy)
sha2 = "0.10"

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "2"

# Version comparison (update checks)
semver = { version = "1", features = ["serde"] }

# HTTP client (update checks only)
reqwest = { version = "0.12", features = ["json"] }

# Windows APIs (mutex, tray, DPI, glass effects)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
] }

# Bloom filter (deduplication)
bloomfilter = "1"

# Synchronous SQLite (for reading Codex state_5.sqlite)
rusqlite = { version = "0.32", features = ["bundled"] }

# Logging
log = "0.4"

[dev-dependencies]
tempfile = "3"
proptest = "1"
