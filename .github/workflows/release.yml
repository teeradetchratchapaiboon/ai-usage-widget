name: Release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: Build and publish installer
    runs-on: windows-latest

    steps:
      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag must look like v1.2.3. Received: $tag"
          }

          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify version matches tag
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value

          if ($tauriVersion -ne $env:RELEASE_VERSION) {
            throw "src-tauri/tauri.conf.json version $tauriVersion does not match tag $env:RELEASE_VERSION"
          }
          if ($packageVersion -ne $env:RELEASE_VERSION) {
            throw "package.json version $packageVersion does not match tag $env:RELEASE_VERSION"
          }
          if ($cargoVersion -ne $env:RELEASE_VERSION) {
            throw "src-tauri/Cargo.toml version $cargoVersion does not match tag $env:RELEASE_VERSION"
          }

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build and typecheck
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

      # createUpdaterArtifacts in tauri.conf.json makes the build sign the
      # installer; fail early with a clear message instead of mid-bundle.
      - name: Check signing secret is configured
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY secret is not set"
          }

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release assets
        id: asset
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem $bundleDir -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          $signatures = @(Get-ChildItem $bundleDir -Filter "*-setup.exe.sig" -File)
          if ($signatures.Count -ne 1) {
            throw "Expected exactly one installer signature, found $($signatures.Count)"
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $assetName = "AI-Usage-Widget-Windows-x64-Setup.exe"
          $asset = "release/$assetName"
          # The signature covers the file bytes, so renaming keeps it valid
          Copy-Item $installers[0].FullName $asset
          Copy-Item $signatures[0].FullName "$asset.sig"

          $sig = (Get-Content -Raw $signatures[0].FullName).Trim()
          if ([string]::IsNullOrWhiteSpace($sig)) {
            throw "Installer signature is empty"
          }

          $manifest = [ordered]@{
            version   = $env:RELEASE_VERSION
            notes     = "AI Usage Widget v$($env:RELEASE_VERSION). See https://github.com/$($env:REPO)/releases/tag/$($env:RELEASE_TAG)"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url       = "https://github.com/$($env:REPO)/releases/download/$($env:RELEASE_TAG)/$assetName"
              }
            }
          }
          $manifestPath = Join-Path (Resolve-Path release) "latest.json"
          [IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))

          $check = Get-Content -Raw $manifestPath | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($check.platforms.'windows-x86_64'.signature)) {
            throw "latest.json has no windows-x86_64 signature"
          }
          "path=$asset" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI Usage Widget ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/AI-Usage-Widget-Windows-x64-Setup.exe
            release/AI-Usage-Widget-Windows-x64-Setup.exe.sig
            release/latest.json
