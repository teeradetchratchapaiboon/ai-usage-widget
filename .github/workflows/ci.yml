name: CI

# The app is Windows-only: the Rust side links windows-rs and calls Win32
# directly (window.rs, tray.rs), so it does not compile on Linux runners. The
# frontend would build anywhere, but running both halves on one runner keeps
# the matrix honest about what is actually verified.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (tests + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runtime dependencies only: dev tooling never ships in the installer
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm test` is already `vitest run`
      - name: Unit tests
        run: npm test

      - name: Vite build
        run: npm run build

  rust:
    name: Rust (fmt + clippy + tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Prebuilt binary with a pinned version, instead of compiling it each run
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      # The frontend build output is not needed for `cargo test`, but
      # tauri::generate_context! reads tauri.conf.json and expects the
      # frontendDist directory to exist.
      # PowerShell rather than bash: this is a Windows runner, so using the
      # default shell drops a dependency on Git Bash being on PATH.
      - name: Prepare dist placeholder
        run: |
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          if (-not (Test-Path ../dist/index.html)) {
            New-Item -ItemType File -Path ../dist/index.html | Out-Null
          }

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      # Checks Cargo.lock against the RustSec advisory database.
      # RUSTSEC-2023-0071 (rsa, no fix available) is only pulled into
      # Cargo.lock by sqlx-mysql; this app enables only the sqlite feature,
      # so rsa is never compiled (`cargo tree -i rsa -e normal` is empty).
      - name: Audit Rust dependencies
        run: cargo audit --ignore RUSTSEC-2023-0071
